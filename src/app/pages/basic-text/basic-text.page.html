<ion-header>
  <ion-toolbar>
      <ion-buttons slot="start">
          <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <ion-title>
          {{'BASIC_TEXT' | translate}}
      </ion-title>
      <ion-buttons slot="end">
        <ion-button color="primary" slot="end" size="small" [routerDirection]="'root'" [routerLink]="'/audiobooks'">{{ 'BACK' | translate }}</ion-button>
      </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="player-header" style="text-align:center;">
    <img style="width:150px; height:150px; text-align:center;" src="./assets/img/audiobooks/basic-text.png"/>
  </div>
  <ion-list class="chapters">
    <ng-container *ngIf="continueIndex >= 0">
      <ion-item-divider sticky>
        <ion-label>{{ 'PLAYER_CONTINUE_LISTENING' | translate }}</ion-label>
      </ion-item-divider>
      <ng-container *ngTemplateOutlet="chapterRow; context: { index: continueIndex }"></ng-container>
      <ion-item-divider sticky>
        <ion-label>{{ 'CHAPTERS' | translate }}</ion-label>
      </ion-item-divider>
    </ng-container>

    <ng-container *ngFor="let chapter of chapters; let i = index">
      <ng-container *ngTemplateOutlet="chapterRow; context: { index: i }"></ng-container>
    </ng-container>
  </ion-list>
</ion-content>

<ng-template #chapterRow let-i="index">
  <ion-item button detail="false" (click)="playChapter(i)" [color]="chapterColor(i)">
    <ion-icon slot="start" [name]="chapterIcon(i)" [color]="chapterIconColor(i)"></ion-icon>
    <ion-label class="ion-text-wrap">
      <h2>{{ chapters[i].title }}</h2>
      <p>{{ chapters[i].duration }}</p>
      <ion-progress-bar *ngIf="progress(i) as bar" [value]="bar.percent || 0"></ion-progress-bar>
      <p *ngIf="progress(i) as bar">
        <ion-note color="primary">{{ bar.label }}</ion-note>
      </p>
    </ion-label>
  </ion-item>
</ng-template>
