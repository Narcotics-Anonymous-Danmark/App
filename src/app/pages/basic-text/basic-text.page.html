<ion-header>
  <ion-toolbar>
      <ion-buttons slot="start">
          <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <ion-title>
          {{'BASIC_TEXT' | translate}}
      </ion-title>
      <ion-buttons slot="end">
        <ion-button color="primary" slot="end" size="small" [routerDirection]="'root'" [routerLink]="'/audiobooks'">{{ 'BACK' | translate }}</ion-button>
      </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="player-header" style="text-align:center;">
    <img style="width:150px; height:150px; text-align:center;" src="./assets/img/audiobooks/basic-text.png"/>
  </div>
  <ion-list class="chapters" #scheduleList>
    <ion-item button *ngIf="resumePoint && activeChapterIndex === -1" lines="full" class="continue-item" (click)="continueListening()">
      <ion-icon slot="start" name="play-circle" color="primary"></ion-icon>
      <ion-label class="ion-text-wrap">
        <h2>{{ 'PLAYER_CONTINUE' | translate }}</h2>
        <p>{{ resumeChapterTitle }} &middot; {{ formatPosition(resumePoint.position) }}</p>
      </ion-label>
    </ion-item>
    <ion-item-sliding *ngFor="let chapter of chapters; let i = index" #slidingItem>
      <ion-item (click)="playChapter(i)" [ngClass]="{active: activeChapterIndex === i}">
        <ion-label class="ion-text-wrap">{{ chapter.title }}</ion-label>
        <ion-note slot="end">{{ chapter.duration }}</ion-note>
      </ion-item>
    </ion-item-sliding>
  </ion-list>
</ion-content>
