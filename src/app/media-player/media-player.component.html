<div class="media-player" *ngIf="visible">
    <div class="media-player__header">
        <div class="media-player__titles">
            <div class="media-player__track">{{ trackTitle }}</div>
            <div class="media-player__playlist" *ngIf="!castState.connected && !castState.connecting">{{ state.playlist?.title }}</div>
            <div class="media-player__playlist media-player__playlist--cast" *ngIf="castState.connected">
                {{ 'PLAYER_PLAYING_ON' | translate:{ device: castState.deviceName || 'Chromecast' } }}
            </div>
            <div class="media-player__playlist" *ngIf="castState.connecting && !castState.connected">
                {{ 'PLAYER_CONNECTING_TO_CAST' | translate }}
            </div>
        </div>
        <ion-button *ngIf="showAirPlay" fill="clear" size="small" class="media-player__route"
            [color]="airPlayActive ? 'primary' : 'medium'"
            (click)="onAirPlayClick()" [attr.aria-label]="'PLAYER_AIRPLAY' | translate">
            <ion-icon slot="icon-only" src="assets/img/player/airplay.svg"></ion-icon>
        </ion-button>
        <ion-button *ngIf="showCast" fill="clear" size="small" class="media-player__route"
            [color]="castState.connected ? 'primary' : 'medium'"
            (click)="onCastClick()"
            [attr.aria-label]="(castState.connected ? 'PLAYER_CAST_CONNECTED' : 'PLAYER_CAST') | translate">
            <ion-spinner *ngIf="castState.connecting && !castState.connected" name="dots"></ion-spinner>
            <ion-icon *ngIf="!castState.connecting || castState.connected" slot="icon-only" [src]="castIcon"></ion-icon>
        </ion-button>
        <ion-button fill="clear" size="small" color="medium" class="media-player__close"
            (click)="player.stop()" [attr.aria-label]="'PLAYER_CLOSE' | translate">
            <ion-icon slot="icon-only" name="close-outline"></ion-icon>
        </ion-button>
    </div>

    <div class="media-player__progress">
        <span class="media-player__time">{{ format(displayPosition) }}</span>
        <input type="range" min="0" step="1"
            [max]="state.duration || 0"
            [value]="displayPosition"
            [disabled]="!state.duration"
            (input)="onSeekInput($event)"
            (change)="onSeekCommit($event)" />
        <span class="media-player__time">{{ state.duration ? format(state.duration) : '--:--' }}</span>
    </div>

    <div class="media-player__controls">
        <ion-button *ngIf="isBook" fill="clear" [disabled]="!hasPrevious"
            (click)="player.previous()" [attr.aria-label]="'PLAYER_PREVIOUS' | translate">
            <ion-icon slot="icon-only" name="play-skip-back-outline"></ion-icon>
        </ion-button>
        <ion-button fill="clear" (click)="player.seekBy(-skipBackward)"
            [attr.aria-label]="'PLAYER_REWIND' | translate">
            <ion-icon slot="icon-only" name="play-back-outline"></ion-icon>
        </ion-button>
        <ion-button fill="clear" class="media-player__play" (click)="player.togglePlayPause()"
            [attr.aria-label]="(state.status === 'playing' ? 'PLAYER_PAUSE' : 'PLAYER_PLAY') | translate">
            <ion-spinner *ngIf="state.status === 'loading'"></ion-spinner>
            <ion-icon *ngIf="state.status !== 'loading'" slot="icon-only"
                [name]="state.status === 'playing' ? 'pause-outline' : 'play-outline'"></ion-icon>
        </ion-button>
        <ion-button fill="clear" (click)="player.seekBy(skipForward)"
            [attr.aria-label]="'PLAYER_FORWARD' | translate">
            <ion-icon slot="icon-only" name="play-forward-outline"></ion-icon>
        </ion-button>
        <ion-button *ngIf="isBook" fill="clear" [disabled]="!hasNext"
            (click)="player.next()" [attr.aria-label]="'PLAYER_NEXT' | translate">
            <ion-icon slot="icon-only" name="play-skip-forward-outline"></ion-icon>
        </ion-button>
    </div>
</div>
